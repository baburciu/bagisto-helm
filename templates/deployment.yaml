apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bagisto.fullname" . }}
  labels:
    app: {{ include "bagisto.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "bagisto.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "bagisto.name" . }}
    spec:
      securityContext:
        # GID 33 = www-data; ensures mounted volumes are group-owned by www-data
        fsGroup: 33
      initContainers:
        - name: init-storage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "Setting up storage directory structure..."
              mkdir -p /storage-shared/app/public
              mkdir -p /storage-shared/framework/cache/data
              mkdir -p /storage-shared/framework/sessions
              mkdir -p /storage-shared/framework/testing
              mkdir -p /storage-shared/framework/views
              mkdir -p /storage-shared/logs
              echo "Storage directory structure created"
              # Copy locale seed images to storage (no-clobber to preserve admin uploads)
              SEED_DIR="/var/www/html/packages/Webkul/Installer/src/Resources/assets/images/seeders/locales"
              if [ -d "$SEED_DIR" ]; then
                mkdir -p /storage-shared/app/public/locales
                cp -n "$SEED_DIR"/*.png /storage-shared/app/public/locales/ 2>/dev/null || true
                echo "Locale seed images synced"
              fi
          volumeMounts:
            - name: bagisto-storage
              mountPath: /storage-shared
      containers:
        - name: bagisto
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            {{- include "bagisto.env" . | nindent 12 }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: bagisto-storage
              mountPath: /var/www/html/storage
            - name: caddyfile
              mountPath: /etc/caddy
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: caddyfile
          configMap:
            name: {{ include "bagisto.fullname" . }}-caddyfile
        - name: bagisto-storage
          persistentVolumeClaim:
            claimName: {{ include "bagisto.fullname" . }}-storage
